name: 아침 시황 수집

on:
  schedule:
    # GitHub 크론은 UTC 기준. 21:00 UTC(일~목) = 한국 06:00(월~금)
    # 서버 혼잡 시 수십 분 늦을 수 있어 여유 있게 잡았습니다.
    - cron: "0 21 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 지표 수집 및 요약
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/collect.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "brief: $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
